
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Підписка — Global Adventures Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Global Adventures Blog</h1>
    <nav>
        <a href="index.html">Головна</a>
        <a href="paris.html">Париж</a>
        <a href="santorini.html">Санторіні</a>
        <a href="new-york.html">Нью-Йорк</a>
        <a href="gallery.html">Галерея</a>
        <a href="contact.html">Контакти</a>
        <a href="subscribe.html">Підписка</a>
    </nav>
</header>

<main>

    <h2>Підпишіться на наш блог!</h2>

    <p>
        Хочете першими дізнаватися про нові подорожі,
        цікаві місця та туристичні поради?
        Залишайте свою електронну адресу!
    </p>

    <section>

        <form action="#" method="post">

            <label for="subscriber-name">Ваше ім'я:</label>
            <input type="text"
                   id="subscriber-name"
                   name="name"
                   placeholder="Введіть ваше ім'я"
                   required>

            <label for="subscriber-email">Електронна пошта:</label>
            <input type="email"
                   id="subscriber-email"
                   name="email"
                   placeholder="example@gmail.com"
                   required>

            <label>
                <input type="checkbox" name="agreement" required>
                Я погоджуюся отримувати новини блогу.
            </label>

            <button type="submit">Підписатися</button>

        </form>

    </section>

</main>

<footer>
    <p>© 2026 Global Adventures Blog</p>
    <p>Подорожуй, відкривай, надихайся!</p>
</footer>

</body>
</html>
